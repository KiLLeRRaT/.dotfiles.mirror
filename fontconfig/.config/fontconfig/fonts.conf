<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!--
	    binding="strong" is required as of fontconfig 2.18: the new
	    48-guessfamily.conf stamps requests for the generic "monospace" family
	    with a strong genericfamily=monospace, which outranks a weak <prefer>.
	    A strong family binding wins over it again. (Worked without it on <=2.17.)
	-->
	<alias binding="strong">
		<family>monospace</family>
		<prefer>
			<family>CaskaydiaCove Nerd Font</family>
			<family>Noto Color Emoji</family>
			<family>Noto Sans Mono</family>
		</prefer>
	</alias>
</fontconfig>

